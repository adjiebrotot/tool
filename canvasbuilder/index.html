<body class="light">

<header class="toolbar">
  <div class="brand">
    <div class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect stroke="#fff" x="3" y="3" width="18" height="18" rx="2"/> <path stroke="#fff" d="M9 3v12M15 3v12M3 15h18"/> </svg></div>
    <span class="brand-text">Canvas Builder</span>
  </div>
  <div class="divider"></div>
  <select class="tb-control" id="canvasTypeSelect">
    <option value="bmc">📋 Business Model Canvas</option>
    <option value="vpc">💎 Value Proposition Canvas</option>
  </select>
  <div class="divider"></div>
  <input type="text" class="tb-control" id="canvasNameInput"
         placeholder="Canvas name…" value="Untitled Canvas" spellcheck="false" autocomplete="off">
  <div class="dirty-dot" id="dirtyDot" title="Unsaved changes"></div>
  <div class="divider"></div>
  <button class="btn btn-primary" id="savePngBtn">⬇ PNG</button>
  <button class="btn btn-primary" id="copyPngBtn" title="Copy PNG to clipboard">⧉</button>
  <button class="btn btn-green"   id="saveJsonBtn">💾 Save</button>
  <button class="btn"             id="loadJsonBtn">📂 Load</button>
  <div class="divider"></div>
  <button class="btn" id="themeBtn">🌙 Dark</button>
  <a href="https://tool.adjiebrotots.com/" class="btn">← Other Tools</a>
  <input type="file" id="jsonFileInput" accept=".json" style="display:none">
</header>

<div class="canvas-area">
  <div class="canvas-wrapper" id="canvasWrapper"><!-- rendered by JS --></div>
</div>

<!-- FLOATING FORMAT BAR -->
<div id="floatingBar">
  <button class="fbar-btn" data-cmd="bold"          title="Bold"><b>B</b></button>
  <button class="fbar-btn" data-cmd="italic"        title="Italic"><i>I</i></button>
  <button class="fbar-btn" data-cmd="underline"     title="Underline"><u>U</u></button>
  <button class="fbar-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
  <div class="fbar-sep"></div>
  <button class="fbar-btn" data-cmd="insertOrderedList"   title="Numbered list">1.</button>
  <button class="fbar-btn" data-cmd="insertUnorderedList" title="Bullet list">•</button>
  <div class="fbar-sep"></div>
  <select class="fbar-sel" id="floatFont" title="Font family">
    <option value="">Sans</option>
    <option value="'Lora',Georgia,serif">Serif</option>
    <option value="'DM Mono',monospace">Mono</option>
    <option value="'Caveat',cursive">Hand</option>
  </select>
  <select class="fbar-sel" id="floatFontSize" title="Font size" style="max-width:56px">
    <option value="9">9</option><option value="10">10</option>
    <option value="11">11</option><option value="12">12</option>
    <option value="13" selected>13</option><option value="14">14</option>
    <option value="16">16</option><option value="18">18</option>
    <option value="20">20</option><option value="24">24</option>
    <option value="28">28</option>
  </select>
  <div class="fbar-sep"></div>
  <span class="fbar-del-btn" id="floatDelBtn" title="Delete item">⊗</span>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <div class="modal-icon" id="confirmIcon">⚠️</div>
    <h3 id="confirmTitle">Unsaved Changes</h3>
    <p  id="confirmMsg">Proceed?</p>
    <div class="modal-btns">
      <button class="btn" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary" id="confirmOk">Proceed</button>
    </div>
  </div>
</div>

<div class="export-overlay" id="exportOverlay">
  <div class="export-spinner"><div class="spinner-ring"></div>Generating PNG…</div>
</div>
<div class="scroll-hint" id="scrollHint">← Swipe canvas to explore →</div>

<script src="../shared.js"></script>
<script src="script.js"></script>

<footer style="padding:0 20px 16px;flex-shrink:0">
  <section style="margin-top:8px;padding:16px 18px;background:var(--panel);border:1px solid var(--border);border-radius:10px">

      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <img src="../logos/indonesian.png" alt="100% Indonesia" style="height:16px;width:auto;flex-shrink:0;border-radius:3px">
        <span style="color:var(--muted);font-size:0.85rem">Made in Australia by Indonesian engineer.</span>
      </div>
    </div>
  </section>
</footer>
