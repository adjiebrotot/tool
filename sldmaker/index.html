<link rel="icon" type="image/svg+xml" href="../logos/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<body class="light">

<header class="toolbar">
  <div class="brand">
    <div class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><path d="M6 8.4v7.2M8.4 6H16a2 2 0 0 1 2 2v8.5"/><circle cx="18" cy="18" r="2.4"/></svg></div>
    <span class="brand-text">SLD Maker</span>
  </div>
  <div class="divider"></div>
  <input type="text" class="tb-control" id="sldNameInput"
         placeholder="Diagram name…" value="Untitled SLD" spellcheck="false" autocomplete="off">
  <div class="dirty-dot" id="dirtyDot" title="Unsaved changes"></div>
  <div class="divider"></div>
  <label style="font-size:.74rem;font-weight:700;color:var(--muted);white-space:nowrap">Colour:</label>
  <select class="tb-control" id="colorModeSelect" title="Colour coding">
    <option value="none">Manual</option>
    <option value="voltage">By voltage</option>
    <option value="tag">By tag</option>
  </select>
  <div class="divider"></div>
  <button class="btn btn-primary" id="savePngBtn">⬇ PNG</button>
  <button class="btn btn-primary" id="copyPngBtn" title="Copy PNG to clipboard">⧉</button>
  <button class="btn btn-green"   id="saveJsonBtn">💾 Save</button>
  <button class="btn"             id="loadJsonBtn">📂 Load</button>
  <div class="divider"></div>
  <button class="btn" id="themeBtn">🌙 Dark</button>
  <a href="https://tool.adjiebrotots.com/" class="btn">← Other Tools</a>
  <input type="file" id="jsonFileInput" accept=".json" style="display:none">
</header>

<div class="app-main" id="appMain">
  <!-- LEFT PALETTE -->
  <aside class="palette" id="palette">
    <div class="palette-head palette-head-main">Tools
      <button class="panel-close" id="paletteClose" aria-label="Close panel" title="Close">×</button>
    </div>
    <div class="mode-bar" id="modeBar">
      <button class="mode-btn active" data-mode="select" title="Select, move, edit">✥ Select</button>
      <button class="mode-btn" data-mode="draw" title="Draw a symbol to place it, or draw from one element to another to connect them">✎ Draw</button>
    </div>
    <div class="palette-head">Elements · drag or tap to add</div>
    <div class="palette-scroll" id="paletteScroll"><!-- filled by JS --></div>
  </aside>

  <!-- CENTER CANVAS -->
  <div class="canvas-area" id="canvasArea">
    <div class="sld-board blank" id="sldBoard">
      <div id="mapLayer"></div>
      <svg id="svgLayer" xmlns="http://www.w3.org/2000/svg">
        <g id="viewport">
          <g id="layerLines"></g>
          <g id="layerEls"></g>
          <g id="layerOverlay"></g>
        </g>
      </svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <!-- RIGHT INSPECTOR -->
  <aside class="inspector" id="inspector">
    <div class="insp-head">
      <span class="insp-title" id="inspTitle">Properties</span>
      <span class="insp-close" id="inspClose">×</span>
    </div>
    <div class="insp-body" id="inspBody"><!-- filled by JS --></div>
  </aside>

  <!-- MOBILE: scrim behind slide-in panels -->
  <div class="panel-scrim" id="panelScrim"></div>
</div>

<!-- MOBILE: floating buttons to open the collapsed side panels -->
<button class="panel-fab fab-left"  id="paletteFab" aria-label="Open tools &amp; elements" title="Tools &amp; elements">✥ Tools</button>
<button class="panel-fab fab-right" id="inspFab"    aria-label="Open properties &amp; controls" title="Properties &amp; controls">⚙ Panel</button>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <div class="modal-icon" id="confirmIcon">⚠️</div>
    <h3 id="confirmTitle">Confirm</h3>
    <p  id="confirmMsg">Proceed?</p>
    <div class="modal-btns">
      <button class="btn" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary" id="confirmOk">Proceed</button>
    </div>
  </div>
</div>

<div class="export-overlay" id="exportOverlay">
  <div class="export-spinner"><div class="spinner-ring"></div>Generating PNG…</div>
</div>

<script src="script.js"></script>
</body>
</html>
