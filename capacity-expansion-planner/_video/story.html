<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capacity Expansion Planner Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F4FF;--panel:#FFFFFF;--text:#2D3436;--muted:#7F8C8D;--border:#E0E6F0;
  --accent:#5A91E8;--accent-strong:#3A71C8;--accent2:#2E9E7A;--neg:#E63939;
  --grid:#C8D4E8;--chart-text:#4A5A6A;
  --shadow:0 4px 32px rgba(120,160,220,0.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.kicker{position:absolute;left:140px;top:64px;font:700 22px 'DM Sans';letter-spacing:.16em;color:var(--accent-strong)}
.head{position:absolute;left:140px;top:100px;width:1640px;font:800 54px/1.12 'DM Sans';letter-spacing:-.01em}
.mono{font-family:'DM Mono',monospace}
.card{background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}
.say{position:absolute;font:500 34px/1.3 'DM Sans';color:var(--text)}
.say b{color:var(--accent-strong);font-weight:700}
.muted{color:var(--muted)}
svg text{font-family:'DM Sans',sans-serif}
#brand{position:absolute;right:56px;top:40px;font:600 20px 'DM Sans';color:var(--muted);opacity:0;display:flex;align-items:center;gap:10px}
#chapters{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:14px;opacity:0}
.chap{position:relative;padding:10px 20px 14px;font:600 19px 'DM Sans';color:var(--muted);border-radius:12px}
.chap .bar{position:absolute;left:20px;right:20px;bottom:6px;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.chap .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.chap.on{color:var(--text);background:var(--panel);box-shadow:0 1px 8px rgba(120,160,220,0.12)}
/* s3 */
.step{position:absolute;left:140px;width:1040px;height:166px;border-radius:20px;padding:26px 32px 0 128px}
.step .ic{position:absolute;left:30px;top:30px;width:72px;height:72px;border-radius:18px;background:#EAF2FF;display:flex;align-items:center;justify-content:center}
.step h3{font:800 36px 'DM Sans';margin-bottom:8px}
.step p{font:500 24px/1.38 'DM Sans';color:var(--muted)}
.shot{position:absolute;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);background:#fff}
.shot img{display:block;width:100%}
/* s5 */
.obj h4{font:800 30px 'DM Sans';margin-bottom:14px}
.obj .row{font:500 24px/1.5 'DM Sans';color:var(--text);display:flex;gap:12px;align-items:center}
.obj .dot{width:12px;height:12px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:#EAF2FF;color:#174A9C;font:600 22px 'DM Sans'}
/* s6 */
.kpi{position:absolute;left:1240px;width:560px;height:148px;padding:20px 26px}
.kpi .l{font:700 17px 'DM Sans';letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.kpi .v{font:600 46px 'DM Mono';margin:4px 0 2px;letter-spacing:-.02em}
.kpi .s{font:500 19px/1.35 'DM Sans';color:var(--muted)}
/* s7 */
#frame{position:absolute;left:304px;top:178px;width:1312px;border-radius:18px;overflow:hidden;box-shadow:0 10px 50px rgba(80,120,190,0.25);border:1px solid var(--border);background:#fff}
#chrome{height:44px;background:#E9EEF8;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid var(--border)}
#chrome i{width:13px;height:13px;border-radius:50%;display:block}
#chrome .url{margin-left:22px;flex:1;max-width:620px;height:28px;border-radius:8px;background:#fff;font:500 16px 'DM Sans';color:var(--muted);display:flex;align-items:center;padding:0 14px}
#view{position:relative;width:1312px;height:738px;overflow:hidden;background:#F0F4FF}
.still{position:absolute;left:0;top:0;width:1312px;height:738px;opacity:0;transform-origin:50% 40%}
.still img{position:absolute;left:0;top:0;width:1312px;height:738px}
.hl{position:absolute;border:4px solid var(--accent);border-radius:16px;box-shadow:0 0 0 9999px rgba(30,45,80,0.20),0 0 24px rgba(90,145,232,.55);opacity:0}
.cap7{position:absolute;left:140px;top:100px;width:1640px;font:800 50px/1.12 'DM Sans';opacity:0}
/* s8 */
.ex{display:inline-block;padding:14px 26px;border-radius:14px;border:2px solid var(--border);background:#fff;font:600 26px 'DM Sans';color:var(--muted);margin:0 8px}
.ex.on{border-color:#2E9E7A;background:#EAF7F2;color:var(--text)}
</style>
</head>
<body>
<div id="stage"></div>
<script src="data.js"></script>
<script src="boxes.js"></script>
<script>
(function(){
'use strict';
var NS = 'http://www.w3.org/2000/svg', stage = document.getElementById('stage');
var clamp = function(x, a, b){ a = a === undefined ? 0 : a; b = b === undefined ? 1 : b; return Math.max(a, Math.min(b, x)); };
var eo = function(x){ return 1 - Math.pow(1 - x, 3); };
var eio = function(x){ return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
var P = function(t, a, b){ return eo(clamp((t - a) / (b - a))); };
var Pio = function(t, a, b){ return eio(clamp((t - a) / (b - a))); };
var fmt = function(n){ return Math.round(n).toLocaleString('en-US'); };
function S(tag, at, parent){ var e = document.createElementNS(NS, tag); for(var k in at) e.setAttribute(k, at[k]); if(parent) parent.appendChild(e); return e; }
function H(tag, cls, html, parent, style){ var e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined && html !== null) e.innerHTML = html; if(style) e.setAttribute('style', style); if(parent) parent.appendChild(e); return e; }
function show(n, p, dy){ dy = dy === undefined ? 26 : dy; n.style.opacity = p; n.style.transform = 'translateY(' + ((1 - p) * dy) + 'px)'; }
function hex(c){ if(c[0] === '#') return [1, 3, 5].map(function(i){ return parseInt(c.substr(i, 2), 16); }); return c.match(/\d+/g).slice(0, 3).map(Number); }
function mix(c, d, a){ var x = hex(c), y = hex(d); return 'rgb(' + x.map(function(v, i){ return Math.round(v + (y[i] - v) * a); }).join(',') + ')'; }

var D = window.D, C = D.cols;
var T = {}; D.tech.forEach(function(t){ T[t.id] = t; });
var COL = { 1: C[0], 2: C[1], 3: C[2], 4: C[3], 5: C[4], 6: C[5] };
var NAME = { 1: 'Coal', 2: 'Gas (CCGT)', 3: 'Gas (OCGT)', 4: 'Solar PV', 5: 'Wind', 6: 'Battery' };
var FILL = function(id){ return mix(COL[id], '#ffffff', 0.22); };

/* Shared SVG patterns: hatch for the plant in service now, dots for storage, as the tool draws them. */
function defs(svg){
  var d = S('defs', {}, svg);
  [[1, 'hC'], [2, 'hG']].forEach(function(a){
    var p = S('pattern', { id: a[1], width: 12, height: 12, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, d);
    S('rect', { width: 12, height: 12, fill: mix(COL[a[0]], '#ffffff', 0.72) }, p);
    S('line', { x1: 0, y1: 0, x2: 0, y2: 12, stroke: mix(COL[a[0]], '#ffffff', 0.25), 'stroke-width': 4 }, p);
  });
  var q = S('pattern', { id: 'dB', width: 10, height: 10, patternUnits: 'userSpaceOnUse' }, d);
  S('rect', { width: 10, height: 10, fill: mix(COL[6], '#ffffff', 0.55) }, q);
  S('circle', { cx: 2.5, cy: 2.5, r: 1.6, fill: mix(COL[6], '#2D5BA8', 0.35) }, q);
  S('circle', { cx: 7.5, cy: 7.5, r: 1.6, fill: mix(COL[6], '#2D5BA8', 0.35) }, q);
  var g = S('pattern', { id: 'hR', width: 10, height: 10, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(-45)' }, d);
  S('rect', { width: 10, height: 10, fill: 'rgba(230,57,57,0.10)' }, g);
  S('line', { x1: 0, y1: 0, x2: 0, y2: 10, stroke: 'rgba(230,57,57,0.45)', 'stroke-width': 3 }, g);
  return d;
}
var defsSvg = S('svg', { width: 0, height: 0, style: 'position:absolute;left:0;top:0' }, stage); defs(defsSvg);
function techFill(id, existing){ if(existing) return id === 1 ? 'url(#hC)' : 'url(#hG)'; return id === 6 ? 'url(#dB)' : FILL(id); }

var scenes = [];
function scene(t0, t1, build){ var el = H('div', 'scene', null, stage); var s = { t0: t0, t1: t1, el: el }; s.draw = build(el, s); scenes.push(s); return s; }
function kicker(el, txt){ return H('div', 'kicker', txt, el); }
function head(el, txt, extra){ return H('div', 'head', txt, el, extra); }

/* ─────────── 1. Title ─────────── */
scene(0, 5, function(el){
  var svg = S('svg', { width: 1920, height: 1080, class: 'abs', style: 'left:0;top:0' }, el);
  // A soft skyline of capacity bars rising behind the title.
  var bars = [], n = 32;
  for(var i = 0; i < n; i++){
    var h = 120 + 260 * Math.pow(1.045, i) / Math.pow(1.045, n) + 60 * Math.sin(i * 1.7);
    var id = [1, 2, 3, 4, 5, 6][i % 6];
    bars.push({ r: S('rect', { x: i * 60 + 4, width: 52, rx: 6, fill: mix(COL[id], '#F0F4FF', 0.78) }, svg), h: h, d: i * 0.035 });
  }
  var icon = S('svg', { width: 150, height: 150, viewBox: '0 0 24 24', class: 'abs', style: 'left:885px;top:250px' }, el);
  var ib = [[4, 15, 3, 5], [9, 11, 3, 9], [14, 13, 3, 7], [19, 8, 3, 12]].map(function(b){ return S('rect', { x: b[0] - 1.5, y: b[1], width: b[2], height: b[3], rx: .8, fill: '#5A91E8' }, icon); });
  var plus = S('path', { d: 'M19 1.5v5M16.5 4h5', stroke: '#2E9E7A', 'stroke-width': 1.9, 'stroke-linecap': 'round', fill: 'none' }, icon);
  var t1 = H('div', 'abs', 'Capacity Expansion Planner', el, 'left:0;width:1920px;top:420px;text-align:center;font:800 104px/1.1 DM Sans;letter-spacing:-.02em');
  var t2 = H('div', 'abs', 'What to build, and when.', el, 'left:0;width:1920px;top:556px;text-align:center;font:700 52px DM Sans;color:#3A71C8');
  var t3 = H('div', 'abs', 'Which plants and batteries to build, how big, and in which year,<br>to meet a growing demand hour by hour at the least cost.', el, 'left:0;width:1920px;top:648px;text-align:center;font:500 32px/1.45 DM Sans;color:#7F8C8D');
  return function(t){
    bars.forEach(function(b){ var p = P(t, 0.1 + b.d, 1.6 + b.d); b.r.setAttribute('y', 1080 - b.h * p); b.r.setAttribute('height', b.h * p); });
    ib.forEach(function(r, i){ var p = P(t, 0.3 + i * 0.12, 0.9 + i * 0.12); r.style.transformOrigin = '0 22px'; r.style.transform = 'scaleY(' + p + ')'; r.style.transformBox = 'fill-box'; r.style.transformOrigin = 'bottom'; });
    plus.style.opacity = P(t, 0.9, 1.3);
    show(t1, P(t, 0.6, 1.4)); show(t2, P(t, 1.2, 2.0)); show(t3, P(t, 1.8, 2.6));
  };
});

/* ─────────── 2. The question ─────────── */
scene(5, 16, function(el){
  kicker(el, 'THE QUESTION');
  var h = head(el, 'A grid that keeps growing, and a plant that closes');
  var svg = S('svg', { width: 1920, height: 1080, class: 'abs', style: 'left:0;top:0' }, el);
  var X0 = 170, X1 = 1180, Y0 = 900, Y1 = 300, VMAX = 2200, yrs = [], N = 25;
  for(var y = 2026; y <= 2050; y++) yrs.push(y);
  var bw = (X1 - X0) / N, yv = function(v){ return Y0 - v / VMAX * (Y0 - Y1); };
  var axis = S('g', {}, svg);
  [0, 500, 1000, 1500, 2000].forEach(function(v){
    S('line', { x1: X0, x2: X1, y1: yv(v), y2: yv(v), stroke: '#C8D4E8', 'stroke-width': 1.5 }, axis);
    S('text', { x: X0 - 16, y: yv(v) + 7, 'text-anchor': 'end', 'font-size': 20, fill: '#4A5A6A' }, axis).textContent = fmt(v);
  });
  [2026, 2031, 2036, 2041, 2046].forEach(function(v){
    S('text', { x: X0 + (v - 2026 + .5) * bw, y: Y0 + 36, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 700, fill: '#4A5A6A' }, axis).textContent = v;
  });
  S('text', { x: 0, y: 0, transform: 'translate(' + (X0 - 92) + ',' + ((Y0 + Y1) / 2) + ') rotate(-90)', 'text-anchor': 'middle', 'font-size': 19, fill: '#7F8C8D' }, axis).textContent = 'MW';
  var gas = [], coal = [], gap = [];
  var peak = function(y){ return 1000 * Math.pow(1.03, y - 2026); };
  yrs.forEach(function(y, i){
    var x = X0 + i * bw + 3;
    gas.push(S('rect', { x: x, width: bw - 6, fill: 'url(#hG)', stroke: COL[2], 'stroke-width': 1.5 }, svg));
    coal.push(S('rect', { x: x, width: bw - 6, fill: 'url(#hC)', stroke: COL[1], 'stroke-width': 1.5 }, svg));
    var fleet = y >= 2036 ? 300 : 1000, pk = peak(y);
    gap.push(pk > fleet ? S('rect', { x: x, width: bw - 6, y: yv(pk), height: yv(fleet) - yv(pk), fill: 'url(#hR)', opacity: 0 }, svg) : null);
  });
  var clip = S('clipPath', { id: 'dclip' }, defsSvg.querySelector('defs')), clipR = S('rect', { x: X0 - 10, y: 0, width: 0, height: 1080 }, clip);
  var pts = yrs.map(function(y, i){ return (X0 + (i + .5) * bw) + ',' + yv(peak(y)); }).join(' ');
  S('polyline', { points: pts, fill: 'none', stroke: '#2D3436', 'stroke-width': 4, 'stroke-dasharray': '12 9', 'clip-path': 'url(#dclip)' }, svg);
  var ret = S('g', { opacity: 0 }, svg);
  var rx = X0 + 10 * bw;
  S('line', { x1: rx, x2: rx, y1: Y1 - 20, y2: Y0, stroke: '#E63939', 'stroke-width': 3, 'stroke-dasharray': '6 6' }, ret);
  S('text', { x: rx + 14, y: Y1 - 2, 'font-size': 24, 'font-weight': 700, fill: '#E63939' }, ret).textContent = 'Coal retires, 2036';
  var gl = S('g', { opacity: 0 }, svg);
  S('text', { x: X0 + 18.5 * bw, y: yv(1150), 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 800, fill: '#C02F2F' }, gl).textContent = '1,506 MW short';
  S('text', { x: X0 + 18.5 * bw, y: yv(1150) + 32, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 600, fill: '#C02F2F' }, gl).textContent = 'at the 2046 peak';
  // Legend
  var lg = H('div', 'abs', '<span style="display:inline-flex;align-items:center;gap:10px;margin-right:30px"><svg width="34" height="20"><rect width="34" height="20" rx="4" fill="' + mix(COL[1], '#ffffff', .6) + '" stroke="' + COL[1] + '"/></svg>Coal, in service</span>' +
    '<span style="display:inline-flex;align-items:center;gap:10px;margin-right:30px"><svg width="34" height="20"><rect width="34" height="20" rx="4" fill="' + mix(COL[2], '#ffffff', .6) + '" stroke="' + COL[2] + '"/></svg>Gas (CCGT), in service</span>' +
    '<span style="display:inline-flex;align-items:center;gap:10px"><svg width="40" height="20"><line x1="0" x2="40" y1="10" y2="10" stroke="#2D3436" stroke-width="4" stroke-dasharray="10 6"/></svg>Peak demand</span>', el,
    'left:' + X0 + 'px;top:226px;font:500 22px DM Sans;color:#4A5A6A');
  var s1 = H('div', 'say', 'Peak demand grows <b>3% a year</b>:<br>1,000 MW now, 1,806 MW by 2046.', el, 'left:1270px;top:330px;width:560px');
  var s2 = H('div', 'say', 'The <b>700 MW coal plant</b> retires in 2036, leaving 300 MW of gas.', el, 'left:1270px;top:500px;width:560px');
  var s3 = H('div', 'say', '<span style="font-weight:800;font-size:38px">What should be built, how big, and in which year, at the least cost?</span>', el, 'left:1270px;top:680px;width:560px');
  return function(t){
    show(h, P(t, 0, .6)); axis.style.opacity = P(t, .2, .8); show(lg, P(t, .4, 1));
    yrs.forEach(function(y, i){
      var p = P(t, .6 + i * .05, 1.3 + i * .05);
      gas[i].setAttribute('y', yv(300 * p)); gas[i].setAttribute('height', yv(0) - yv(300 * p));
      var cp = y >= 2036 ? p * (1 - P(t, 5.6, 6.6)) : p;
      coal[i].setAttribute('y', yv(300 + 700 * cp)); coal[i].setAttribute('height', yv(300) - yv(300 + 700 * cp));
      coal[i].style.opacity = y >= 2036 ? 1 - P(t, 5.6, 6.6) * .6 : 1;
      if(gap[i]) gap[i].setAttribute('opacity', P(t, 7 + (i - 10) * .05, 7.6 + (i - 10) * .05));
    });
    clipR.setAttribute('width', (X1 - X0 + 20) * Pio(t, 2.2, 4.6));
    ret.setAttribute('opacity', P(t, 5.2, 5.7));
    gl.setAttribute('opacity', P(t, 7.8, 8.4));
    show(s1, P(t, 2.6, 3.2)); show(s2, P(t, 5.2, 5.8)); show(s3, P(t, 8.4, 9.1));
  };
});

/* ─────────── 3. The inputs ─────────── */
scene(16, 28, function(el){
  kicker(el, 'THE INPUTS');
  var h = head(el, 'You describe the system in four tabs');
  var icons = {
    plan: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3A71C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><circle cx="20" cy="6" r="1.2" fill="#3A71C8"/></svg>',
    tech: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3A71C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V11l5 3V11l5 3V5h4v16z"/><path d="M3 21h18"/></svg>',
    policy: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3A71C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
    assume: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3A71C8" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'
  };
  var steps = [
    ['plan', 'Demand', 'The peak now, how fast it grows, and the load profile for your climate. The years to plan and how often to decide.'],
    ['tech', 'Supply', 'What is in service and when it retires, and what can be built (solar, wind, gas, batteries and more) at what cost.'],
    ['policy', 'Policy', 'Load shedding at the value of lost load, a carbon price that can rise every year, and a net-zero year.'],
    ['assume', 'Assumptions', 'The discount rate, the typical days each year is run over, and the solver.']
  ];
  var nodes = steps.map(function(s, i){
    var n = H('div', 'step', '<div class="ic">' + icons[s[0]] + '</div><h3>' + s[1] + '</h3><p>' + s[2] + '</p>', el, 'top:' + (226 + i * 182) + 'px');
    return n;
  });
  var shots = steps.map(function(s){
    var w = H('div', 'shot', '<img src="shots/ctrl-' + s[0] + '.png">', el, 'left:1300px;top:206px;width:440px;height:760px');
    return w;
  });
  var SEG = 2.6, A = 1.0;
  return function(t){
    show(h, P(t, 0, .6));
    nodes.forEach(function(n, i){
      var a = A + i * SEG, appear = P(t, .3 + i * .15, .9 + i * .15);
      var on = clamp(P(t, a, a + .35) - P(t, a + SEG, a + SEG + .35));
      if(i === 3) on = P(t, a, a + .35);
      show(n, appear, 20);
      n.style.background = 'rgba(255,255,255,' + (0.0 + on) + ')';
      n.style.boxShadow = on > .01 ? '0 4px 32px rgba(120,160,220,' + (0.18 * on) + ')' : 'none';
      n.style.border = '1px solid rgba(224,230,240,' + on + ')';
      n.style.opacity = appear * (0.42 + 0.58 * on);
      n.querySelector('h3').style.color = on > .5 ? '#3A71C8' : '#2D3436';
    });
    shots.forEach(function(w, i){
      var a = A + i * SEG, p = i === 0 ? P(t, .6, 1.2) : P(t, a, a + .45);
      var q = i === 3 ? 0 : P(t, a + SEG, a + SEG + .45);
      w.style.opacity = p * (1 - q);
      w.style.transform = 'translateX(' + ((1 - p) * 40 - q * 40) + 'px)';
    });
  };
});

/* ─────────── 4. Hour by hour ─────────── */
scene(28, 41, function(el){
  kicker(el, 'HOW IT THINKS');
  var h = head(el, 'Every year is run hour by hour');
  var svg = S('svg', { width: 1920, height: 1080, class: 'abs', style: 'left:0;top:0' }, el);
  var K = 4, X0 = 180, X1 = 1140, Y0 = 640, YT = 220, VMIN = -600, VMAX = 2200;
  var svgOuter = svg; svg = S('g', {}, svgOuter); var mainG = svg;
  var yv = function(v){ return Y0 - (v - 0) / VMAX * (Y0 - YT); }; // 0 at Y0, negatives below
