<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rent vs Own — Sensitivity Tool</title>
<meta name="description" content="Run sensitivity analysis on rent-versus-own assumptions to see which variables affect property outcomes most.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tool.adjiebrotots.com/rentvsownhouse/sensitivity/">
<link rel="sitemap" type="application/xml" href="https://tool.adjiebrotots.com/sitemap.xml">

<meta property="og:type" content="website">
<meta property="og:title" content="Rent vs Own Sensitivity Tool">
<meta property="og:description" content="Run sensitivity analysis on rent-versus-own assumptions to see which variables affect property outcomes most.">
<meta property="og:url" content="https://tool.adjiebrotots.com/rentvsownhouse/sensitivity/">
<meta property="og:site_name" content="Adjie Brotot Tools">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Rent vs Own Sensitivity Tool">
<meta name="twitter:description" content="Run sensitivity analysis on rent-versus-own assumptions to see which variables affect property outcomes most.">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Rent vs Own Sensitivity Tool",
  "url": "https://tool.adjiebrotots.com/rentvsownhouse/sensitivity/",
  "description": "Run sensitivity analysis on rent-versus-own assumptions to see which variables affect property outcomes most.",
  "applicationCategory": "FinanceApplication",
  "operatingSystem": "Any",
  "isAccessibleForFree": true,
  "inLanguage": "en"
}
</script>
<style>.abbr-hint{text-decoration:underline dotted;cursor:help;text-underline-offset:2px;}</style>
<link rel="icon" type="image/svg+xml" href="../../logos/logo.svg">
<script src="../tooltips.js"></script>
<script src="../footer.js"></script>
<link rel="stylesheet" href="../../dark.css">
<link rel="stylesheet" href="../../light.css">
<link rel="stylesheet" href="../../shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="light">
<div class="container">

<!-- HEADER -->
<section class="header card">
  <div class="header-left">
    <h1 data-i18n="sensTitle">🏠 Rent vs Own — Sensitivity Tool</h1>
    <p data-i18n="sensSubtitle">Model the long-term financial outcome of renting vs buying property — comparing cash, equity, and net wealth over time.</p>
  </div>
  <div class="header-right">
    <a href="../" class="btn-theme btn-back" data-i18n="btnBack">← Back</a>
    <button id="langToggle" class="btn-theme">ID</button>
    <button class="btn-theme" id="themeToggle">🌙 Dark</button>
  </div>
</section>

<!-- CONTROLS BAR -->
<div class="controls-bar card">
  <div class="ctrl-row">
    <span class="controls-label" data-i18n="labelCurrency">Currency:</span>
    <select class="ctrl-select" id="currencySelect">
      <option value="$">$ — Dollar</option>
      <option value="€">€ — Euro</option>
      <option value="£">£ — Pound</option>
      <option value="¥">¥ — Yen / Yuan</option>
      <option value="₩">₩ — Won</option>
      <option value="₱">₱ — Peso</option>
      <option value="Rp">Rp — Rupiah</option>
      <option value="RM">RM — Ringgit</option>
      <option value="฿">฿ — Baht</option>
    </select>
  </div>
  <div class="ctrl-row">
    <span class="controls-label" data-i18n="labelMetric">Metric:</span>
    <div class="seg-group" id="metricGroup">
      <button class="seg-btn active" data-metric="netEquity" data-i18n="metricNetEquity">Net Equity</button>
      <button class="seg-btn" data-metric="cash" data-i18n="metricLiquidCash">Liquid Cash</button>
      <button class="seg-btn" data-metric="cost" data-i18n="metricAccumCost">Accum. Cost</button>
    </div>
  </div>
  <div class="ctrl-row year-wrap">
    <span class="controls-label" data-i18n="labelAtYear">At Year:</span>
    <input type="number" class="year-input" id="yearInput" min="1" max="60" value="30"/>
    <span class="year-hint" data-i18n="yearHint">(clamped to each scenario's horizon)</span>
  </div>
  <button class="btn-theme" id="downloadCSVBtn" style="margin-left:auto;" data-i18n="btnCSV">⬇ CSV</button>
</div>

<!-- SENSITIVITY TABLE -->
<section class="card" style="overflow:hidden;padding:0;">
  <div id="tableWrap" class="sens-wrap" style="padding:16px;">
  </div>
</section>

<footer class="page-footer">
  <section class="page-footer-info" id="siteFooterContent"></section>
</footer>
<script>renderRVOFooter('../../logos/');</script>

</div><!-- /container -->

<div id="globalTooltip"><div class="tt-text"></div><div class="tt-arrow"></div></div>

<script src="script.js"></script>
</body>
</html>
