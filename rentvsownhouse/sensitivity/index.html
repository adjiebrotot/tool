<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#0F1728;--panel:#162033;--panel-raised:#1C2942;--text:#EAF1FF;--muted:#A8B6CF;--border:#2C3A52;
  --accent:#8DBBFF;--accent-strong:#B3D1FF;--accent2:#8FCDBD;--accent3:#FF8B8B;--gold:#FFD28C;
  --input-bg:#111C2F;--card-bg:#162033;
  --shadow:0 2px 16px rgba(120,160,220,0.12);--shadow-sm:0 1px 8px rgba(120,160,220,0.08);--shadow-lg:0 4px 32px rgba(120,160,220,0.18);
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-2xl:20px;
  --data-pos:#0052CC;--data-pos-em:#7FB2FF;--data-neg:#E63939;--data-neg-em:#FF8B8B;
  --data-pos-bg:#10284D;--data-neg-bg:#4A1C1C;
  --data-pos-border:#2D67C7;--data-neg-border:#C85F5F;
  --motion-fast:150ms;--motion-base:250ms;
}
body.light {
  --bg:#F0F4FF;--panel:#FFFFFF;--panel-raised:#FFFFFF;--text:#2D3436;--muted:#7F8C8D;--border:#E0E6F0;
  --accent:#5A91E8;--accent-strong:#3A71C8;--accent2:#2E9E7A;--accent3:#E63939;--gold:#B45309;
  --input-bg:#F8FBFF;--card-bg:#FFFFFF;
  --shadow:0 2px 16px rgba(120,160,220,0.12);--shadow-sm:0 1px 8px rgba(120,160,220,0.08);--shadow-lg:0 4px 32px rgba(120,160,220,0.18);
  --data-pos:#0052CC;--data-pos-em:#0052CC;--data-neg:#E63939;--data-neg-em:#E63939;
  --data-pos-bg:#EAF2FF;--data-neg-bg:#FDECEC;
  --data-pos-border:#8FB5FF;--data-neg-border:#F3A5A5;
}
*{box-sizing:border-box;min-width:0;margin:0;padding:0;}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);transition:background var(--motion-base),color var(--motion-base);min-height:100vh;overflow-x:hidden;}
.container{max-width:1600px;margin:0 auto;padding:20px 24px;}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);}

/* Header */
.header{padding:18px 24px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.header-left h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;}
.header-left p{color:var(--muted);font-size:.88rem;line-height:1.5;}
.header-right{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.btn-theme{background:var(--input-bg);border:1.5px solid var(--border);color:var(--muted);border-radius:var(--radius-md);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--motion-fast);white-space:nowrap;font-family:inherit;}
.btn-theme:hover{border-color:var(--accent);color:var(--text);}
a.btn-theme{text-decoration:none;display:inline-flex;align-items:center;}

/* Controls bar */
.controls-bar{padding:12px 20px;margin-bottom:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.controls-label{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;}

/* Segmented controls */
.seg-group{display:inline-flex;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
.seg-btn{background:transparent;border:none;padding:7px 14px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all var(--motion-fast);font-family:inherit;white-space:nowrap;}
.seg-btn.active{background:var(--accent);color:#fff;}
.seg-btn:not(.active):hover{color:var(--text);}

/* Year input */
.year-wrap{display:flex;align-items:center;gap:8px;}
.year-input{width:4.5em;background:var(--input-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:.85rem;font-family:'DM Mono',monospace;padding:6px 8px;text-align:center;}
.year-input:focus{outline:none;border-color:var(--accent);}
.year-hint{font-size:.75rem;color:var(--muted);}

/* Table scroll wrapper */
.sens-wrap{overflow-x:auto;padding-bottom:2px;}

/* Detail table — adapted from costofliving-comparator */
table.dt{width:100%;border-collapse:collapse;font-size:.84rem;}
.dt th{padding:10px 11px;background:var(--input-bg);border:1px solid var(--border);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;text-align:left;vertical-align:bottom;}
.dt td{padding:7px 9px;border:1px solid var(--border);vertical-align:middle;}
.dt .num-td{font-family:'DM Mono',monospace;text-align:right;}
.dt .label-td{font-weight:600;min-width:190px;white-space:nowrap;color:var(--text);background:var(--input-bg);}
.dt .scen-th{min-width:175px;text-align:center;}
.dt .scen-td{min-width:175px;}

/* Scenario header cell */
.scen-header-cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;}
.scen-name-input{background:transparent;border:none;border-bottom:1.5px solid var(--border);color:var(--text);font-weight:700;font-size:.85rem;width:100%;outline:none;padding:2px 0;font-family:inherit;}
.scen-name-input:focus{border-bottom-color:var(--accent);}
.scen-header-actions{display:flex;align-items:center;gap:6px;width:100%;}
.scen-header-sub{font-size:.7rem;color:var(--muted);font-family:'DM Mono',monospace;}

/* Buttons */
.btn-add{background:transparent;border:1px dashed var(--border);border-radius:8px;padding:5px 13px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all 140ms;font-family:inherit;white-space:nowrap;}
.btn-add:hover{border-color:var(--accent-strong);color:var(--accent-strong);}
.btn-remove{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:2px 5px;border-radius:5px;transition:all 130ms;font-family:inherit;line-height:1;}
.btn-remove:hover{background:var(--data-neg-bg);color:var(--data-neg-em);}
.btn-dupe{background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.72rem;padding:2px 6px;border-radius:5px;transition:all 130ms;font-family:inherit;line-height:1.4;}
.btn-dupe:hover{border-color:var(--accent);color:var(--accent);}

/* Separator row */
.dt tr.sep-tr td{padding:0;border-top:2px dashed var(--accent);border-bottom:none;border-left:1px solid var(--border);border-right:1px solid var(--border);height:2px;}

/* Output rows */
.dt tr.out-own td{background:var(--data-pos-bg);font-weight:700;}
.dt tr.out-rent td{background:rgba(143,205,189,.18);font-weight:700;}
body.light .dt tr.out-rent td{background:#E8F7F3;}
.dt tr.out-delta td{background:var(--input-bg);font-weight:700;}

/* Number colors */
.pos-val{color:var(--data-pos-em);}
.neg-val{color:var(--data-neg-em);}

/* Param inputs in table */
.param-input{background:var(--input-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:.82rem;font-family:'DM Mono',monospace;padding:5px 8px;width:100%;min-width:110px;transition:border-color var(--motion-fast);}
.param-input:focus{outline:none;border-color:var(--accent);}
.param-unit{font-size:.72rem;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace;}

/* Tooltip */
.tip-wrap{position:relative;display:inline-flex;align-items:center;cursor:help;margin-left:4px;}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--input-bg);border:1px solid var(--border);font-size:.65rem;color:var(--muted);flex-shrink:0;}
.tip-box{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--panel-raised,var(--panel));border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:.78rem;color:var(--text);width:240px;white-space:normal;box-shadow:var(--shadow-lg);z-index:300;font-weight:400;text-transform:none;letter-spacing:normal;line-height:1.5;}
.tip-wrap:hover .tip-box{display:block;}

/* Footer — styling provided by footer.js */
.page-footer{margin-top:18px;}

@media(max-width:600px){
  .container{padding:10px 12px;}
  .header{padding:14px 16px;}
  .header-left h1{font-size:1.25rem;}
  .controls-bar{gap:12px;}
}
</style>

<body>
<div class="container">

<!-- HEADER -->
<section class="header card">
  <div class="header-left">
    <h1>📊 Sensitivity Analysis</h1>
    <p>Add scenarios, tweak any parameter per column — Own vs Rent results update live.</p>
  </div>
  <div class="header-right">

<!-- CONTROLS BAR -->
<div class="controls-bar card">
  <span class="controls-label">Metric:</span>

</div>

<!-- SENSITIVITY TABLE -->
<section class="card" style="overflow:hidden;padding:0;">
  <div id="tableWrap" class="sens-wrap" style="padding:16px;">
    <!-- rebuilt by rerender() -->
  </div>

</div><!-- /container -->

  <section class="page-footer-info" id="siteFooterContent"></section>

<script>
(function(){
'use strict';

/* ── PARAMS ── */
var T = window.RVO_TIPS || {};
const PARAMS = [
  {key:'propertyPrice',  label:'Property Price',        type:'currency', min:50000, step:10000, tip:T.propertyPrice},
  {key:'downPaymentPct', label:'Down Payment',           type:'percent',  min:0, max:99, step:0.5, tip:T.downPaymentPct},
  {key:'mortgageRate',   label:'Mortgage Rate',          type:'percent',  min:0, max:25, step:0.05, tip:T.mortgageRate},
  {key:'mortgageTerm',   label:'Mortgage Term',          type:'integer',  min:1, max:40, step:1, unit:'yrs', tip:T.mortgageTerm},
  {key:'riskFreeRate',   label:'Risk-Free Rate',         type:'percent',  min:0, max:25, step:0.05, tip:T.riskFreeRate},
  {key:'houseGrowth',    label:'House Growth Rate',      type:'percent',  min:-10, max:30, step:0.1, tip:T.houseGrowth},
  {key:'horizon',        label:'Horizon',                type:'integer',  min:1, max:60, step:1, unit:'yrs', tip:T.horizon},
  {key:'rentAmount',     label:'Monthly Rent',           type:'currency', min:0, step:50, tip:T.rentAmount},
  {key:'rentInflation',  label:'Rent Inflation',         type:'percent',  min:-5, max:25, step:0.1, tip:T.rentInflation},
  {key:'ownOngoingCost', label:'Own Ongoing Cost',       type:'currency', min:0, step:100, unit:'/yr', tip:T.ownOngoingCost},
  {key:'rentOngoingCost',label:'Rent Ongoing Cost',      type:'currency', min:0, step:100, unit:'/yr', tip:T.rentOngoingCost},
  {key:'setupCost',      label:'Setup Cost',             type:'currency', min:0, step:500, tip:T.setupCost},
];

const DEFAULT_SCENARIO = {
  name: 'Base Case',
  propertyPrice: 800000,
  downPaymentPct: 20,
  mortgageRate: 6.0,
  mortgageTerm: 30,
  riskFreeRate: 4.5,
  houseGrowth: 5.0,
  horizon: 30,
  rentAmount: 2800,
  rentInflation: 3.0,
  ownOngoingCost: 6000,
  rentOngoingCost: 1200,
  setupCost: 32000,
  currencySymbol: '$',
};

/* ── STATE ── */
let scenarios = [Object.assign({}, DEFAULT_SCENARIO)];
let metric = 'netEquity';
let viewYear = 30;
let scenarioResults = [];

/* ── UTILITIES ── */
function parseNum(val){
  if(typeof val==='number') return Number.isFinite(val) ? val : 0;
  const cleaned = String(val ?? '').replace(/,/g,'').replace(/[^\d.-]/g,'').trim();
  if(cleaned==='' || cleaned==='-' || cleaned==='.' || cleaned==='-.') return 0;
  const parsed = Number(cleaned);
  return Number.isFinite(parsed) ? parsed : 0;
}
function parseFloatSafe(val, fallback){ const n=parseFloat(val); return isNaN(n)?fallback:n; }
function parseIntSafe(val, fallback){ const n=parseInt(val); return isNaN(n)?fallback:n; }
function toYearly(val, freq){ if(freq==='weekly') return val*52; if(freq==='monthly') return val*12; return val; }
function toMonthly(val, freq){ if(freq==='weekly') return val*52/12; if(freq==='yearly') return val/12; return val; }

function fmtCurrency(v, sym){
  sym = sym || '$';
  const n = Number(v||0), abs = Math.abs(n), sign = n<0 ? '−' : '';
  if(abs>=1e9) return sign+sym+(abs/1e9).toFixed(2)+'b';
  if(abs>=1e6) return sign+sym+(abs/1e6).toFixed(2)+'m';
  if(abs>=1000) return sign+sym+(abs/1000).toFixed(0)+'k';
  return sign+sym+Math.round(abs);
}
function fmtPct(v){ return Number(v||0).toFixed(2)+'%'; }

/* ── COMPUTE ENGINE (adapted from main page — S is now a parameter) ── */
function calcMonthlyMortgage(principal, annualRate, termYears, type){
  const r = annualRate/100/12;
  const n = termYears*12;
  if(type==='io') return principal*r;
  if(r===0) return principal/n;
  return principal*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
}

function buildStateObj(sc){
  return {
    propertyPrice:      Math.max(50000, sc.propertyPrice || 800000),
    downPaymentPct:     sc.downPaymentPct ?? 20,
    mortgageRate:       sc.mortgageRate ?? 6.0,
    mortgageTerm:       sc.mortgageTerm ?? 30,
    mortgageType:       'pi',
    riskFreeRate:       sc.riskFreeRate ?? 4.5,
    houseGrowth:        sc.houseGrowth ?? 5.0,
    horizon:            Math.max(1, sc.horizon || 30),
    setupCost:          Math.max(0, sc.setupCost || 0),
    setupCostType:      'dollar',
    ownOngoingCost:     Math.max(0, sc.ownOngoingCost || 0),
    ownOngoingCostFreq: 'yearly',
    ownOngoingCostType: 'dollar',
    ownOngoingInflation: 0,
    rentAmount:         Math.max(0, sc.rentAmount || 0),
    rentFreq:           'monthly',
    rentInflation:      sc.rentInflation ?? 3.0,
    rentOngoingCost:    Math.max(0, sc.rentOngoingCost || 0),
    rentOngoingCostFreq: 'yearly',
    rentOngoingCostType: 'dollar',
    rentOngoingInflation: 0,
    initialCash:        0,
    costInterestOnly:   true,
    rtbEnabled:         false,
    rtbBuyYear:         5,
    monthlyBudget:      0,
    monthlyBudgetIncrease: 0,
    currencySymbol:     sc.currencySymbol || '$',
  };
}

function computeModel(S){
  const P  = S.propertyPrice;
  const dp = P * S.downPaymentPct/100;
  const loan = P - dp;
  const rfr  = S.riskFreeRate/100;

  const setupCostDollar = S.setupCostType==='pct' ? P*S.setupCost/100 : S.setupCost;
  const mPayment = calcMonthlyMortgage(loan, S.mortgageRate, S.mortgageTerm, S.mortgageType);
  const rentMonthly0 = toMonthly(S.rentAmount, S.rentFreq);

  const rentOngoingYearly0 = S.rentOngoingCostType==='pct'
    ? rentMonthly0 * 12 * S.rentOngoingCost/100
    : toYearly(S.rentOngoingCost, S.rentOngoingCostFreq);

  const h  = S.houseGrowth/100;
  const ri = S.rentInflation/100;

  function ownRequiredMonthly(year){
    const propVal = P * Math.pow(1+h, Math.max(0, year-1));
    let ownOngoing = toYearly(S.ownOngoingCost, S.ownOngoingCostFreq);
    if(S.ownOngoingCostType==='pct') ownOngoing = propVal * S.ownOngoingCost/100;
    else ownOngoing *= Math.pow(1 + S.ownOngoingInflation/100, year-1);
    const ownMort = S.mortgageType==='pi' ? (year <= S.mortgageTerm ? mPayment : 0) : (loan>0?mPayment:0);
    return ownMort + ownOngoing/12;
  }

  function rentRequiredMonthly(year){
    const curRent = rentMonthly0 * Math.pow(1+ri, year-1);
    let rentOngoing = toYearly(S.rentOngoingCost, S.rentOngoingCostFreq);
    if(S.rentOngoingCostType==='pct') rentOngoing = curRent*12*S.rentOngoingCost/100;
    else rentOngoing *= Math.pow(1+S.rentOngoingInflation/100, year-1);
    return curRent + rentOngoing/12;
  }

  function getAutoMonthly(year){
    return Math.max(ownRequiredMonthly(year), rentRequiredMonthly(year));
  }

  const requiredNow = dp + setupCostDollar;
  const rentFirstYearCost = rentMonthly0*12 + rentOngoingYearly0;
  const autoInitialCash = Math.max(requiredNow, rentFirstYearCost);

  const initialCashUsed    = autoInitialCash;
  const ownCashStart       = initialCashUsed - requiredNow;
  const renterStartCapital = initialCashUsed;

  const rows = [];
  let ownPropValue    = P;
  let ownPrincipal    = loan;
  let ownCash         = ownCashStart;
  let ownAccumCost    = setupCostDollar;
  let ownAccumInterest= 0;
  let rentCash        = renterStartCapital;
  let rentAccumCost   = 0;

  rows.push({
    year:0,
    ownPropValue, ownPrincipal, ownCash,
    ownHouseEquity: ownPropValue-ownPrincipal,
    ownNetEquity: ownPropValue-ownPrincipal+ownCash,
    ownAccumCost: setupCostDollar, ownAccumInterest:0,
    rentCash, rentNetEquity:rentCash, rentAccumCost:0,
  });

  const r12 = S.mortgageRate/100/12;
  const rfm = Math.pow(1+rfr, 1/12)-1;

  for(let yr=1; yr<=S.horizon; yr++){
    const currentRentMonthly = rentMonthly0 * Math.pow(1+ri, yr-1);

    let ownOngoingYearly = toYearly(S.ownOngoingCost, S.ownOngoingCostFreq);
    if(S.ownOngoingCostType==='pct') ownOngoingYearly = ownPropValue * S.ownOngoingCost/100;
    else ownOngoingYearly *= Math.pow(1 + S.ownOngoingInflation/100, yr-1);
    const ownOngoingMonthly = ownOngoingYearly / 12;

    let rentOngoingYearly = toYearly(S.rentOngoingCost, S.rentOngoingCostFreq);
    if(S.rentOngoingCostType==='pct') rentOngoingYearly = currentRentMonthly*12*S.rentOngoingCost/100;
    else rentOngoingYearly *= Math.pow(1+S.rentOngoingInflation/100, yr-1);
    const rentOngoingMonthly = rentOngoingYearly / 12;

    let yearInterest = 0;

    for(let m=0; m<12; m++){
      const hasMortgage = ownPrincipal > 1e-2;
      const mMortgage   = hasMortgage ? mPayment : 0;
      const mOwnCost    = mMortgage + ownOngoingMonthly;
      const mRentCost   = currentRentMonthly + rentOngoingMonthly;
      const mBudget     = getAutoMonthly(yr);

      let mInterest = 0;
      if(hasMortgage){
        mInterest = ownPrincipal * r12;
        const principal = S.mortgageType==='pi' ? Math.min(mPayment-mInterest, ownPrincipal) : 0;
        yearInterest     += mInterest;
        ownPrincipal      = Math.max(0, ownPrincipal - principal);
        ownAccumInterest += mInterest;
      }

      const ownSurplus  = mBudget - mOwnCost;
      const rentSurplus = mBudget - mRentCost;
      ownCash  = ownCash  * (1+rfm) + ownSurplus;
      rentCash = rentCash * (1+rfm) + rentSurplus;

      const ownCostMonth = S.costInterestOnly ? mInterest+ownOngoingMonthly : mOwnCost;
      ownAccumCost  += ownCostMonth;
      rentAccumCost += mRentCost;
    }

    ownPropValue = ownPropValue * (1+h);

    const ownHouseEquity = ownPropValue - ownPrincipal;
    const ownNetEquity   = ownHouseEquity + ownCash;
    const rentNetEquity  = rentCash;

    rows.push({
      year:yr,
      ownPropValue, ownPrincipal, ownCash,
      ownHouseEquity, ownNetEquity, ownAccumCost, ownAccumInterest,
      ownYearInterest: yearInterest,
      rentCash, rentNetEquity, rentAccumCost,
    });
  }

  return { rows, initialCashUsed, ownCashStart, renterStartCapital };
}

/* ── HELPERS ── */
function metricLabel(){
  if(metric==='netEquity') return 'Net Equity';
  if(metric==='cash')      return 'Liquid Cash';
  return 'Accum. Cost';
}

function getMetricValues(i){
  const res = scenarioResults[i];
  if(!res || !res.rows) return {own:null, rent:null};
  const sc = scenarios[i];
  const yr = Math.min(viewYear, sc.horizon || 30);
  const row = res.rows[yr];
  if(!row) return {own:null, rent:null};
  if(metric==='netEquity') return {own:row.ownNetEquity,  rent:row.rentNetEquity};
  if(metric==='cash')      return {own:row.ownCash,       rent:row.rentCash};
  return                          {own:row.ownAccumCost,  rent:row.rentAccumCost};
}

function deltaColor(delta){
  if(metric==='cost') return delta>0 ? 'neg-val' : 'pos-val';
  return delta>=0 ? 'pos-val' : 'neg-val';
}

/* ── SCENARIO MANAGEMENT ── */
function addScenario(){
  const base = scenarios[scenarios.length-1];
  const clone = Object.assign({}, base);
  clone.name = 'Scenario '+(scenarios.length+1);
  scenarios.push(clone);
  rerender();
}

function removeScenario(i){
  if(scenarios.length<=1) return;
  scenarios.splice(i,1);
  scenarioResults.splice(i,1);
  rerender();
}

/* ── BUILD TABLE HTML ── */
function buildTableHTML(){
  const n = scenarios.length;
  const sym = s => (s && s.currencySymbol) || '$';

  // Header row
  let thScens = scenarios.map((sc,i)=>{
    const clampedYr = Math.min(viewYear, sc.horizon||30);
    const showClamp = clampedYr < viewYear;
    return `<th class="scen-th">
      <div class="scen-header-cell">
        <div class="scen-header-actions">
          <input class="scen-name-input" data-si="${i}" value="${escHtml(sc.name)}" placeholder="Scenario ${i+1}"/>
          <button class="btn-dupe" data-si="${i}" title="Duplicate scenario">⧉</button>
          ${n>1 ? `<button class="btn-remove rmv-scen" data-si="${i}" title="Remove">✕</button>` : ''}
        </div>
        ${showClamp ? `<span class="scen-header-sub">capped at yr ${clampedYr}</span>` : ''}
      </div>
    </th>`;
  }).join('');

  // Parameter input rows
  let paramRows = PARAMS.map(p=>{
    const tipHtml = p.tip ? `<span class="tip-wrap"><span class="tip-icon">?</span><span class="tip-box">${p.tip}</span></span>` : '';
    let labelHtml = p.label + tipHtml;
    if(p.unit) labelHtml += `<br><span class="param-unit">${p.unit}</span>`;

    const tds = scenarios.map((sc,i)=>{
      const val = sc[p.key];
      const inputType = (p.type==='integer'||p.type==='percent'||p.type==='currency') ? 'number' : 'text';
      const step = p.step ?? 'any';
      const minAttr = (p.min !== undefined) ? `min="${p.min}"` : '';
      const maxAttr = (p.max !== undefined) ? `max="${p.max}"` : '';
      const dispVal = (p.type==='currency') ? (val||0) : (val||0);
      return `<td class="scen-td">
        <input class="param-input" type="${inputType}"
          data-si="${i}" data-key="${p.key}"
          value="${dispVal}" step="${step}" ${minAttr} ${maxAttr}/>
      </td>`;
    }).join('');
    return `<tr>
      <td class="label-td">${labelHtml}</td>
      ${tds}
      <td style="border:1px solid var(--border);background:var(--input-bg);"></td>
    </tr>`;
  }).join('');

  // Output rows
  const ownTds = scenarios.map((_,i)=>{
    const v = getMetricValues(i);
    if(v.own===null) return `<td class="scen-td num-td">—</td>`;
    return `<td class="scen-td num-td">${fmtCurrency(v.own, sym(scenarios[i]))}</td>`;
  }).join('');

  const rentTds = scenarios.map((_,i)=>{
    const v = getMetricValues(i);
    if(v.rent===null) return `<td class="scen-td num-td">—</td>`;
    return `<td class="scen-td num-td">${fmtCurrency(v.rent, sym(scenarios[i]))}</td>`;
  }).join('');

  const deltaTds = scenarios.map((_,i)=>{
    const v = getMetricValues(i);
    if(v.own===null) return `<td class="scen-td num-td">—</td>`;
    const d = v.own - v.rent;
    const cls = deltaColor(d);
    const sign = d>=0 ? '+' : '';
    return `<td class="scen-td num-td ${cls}">${sign}${fmtCurrency(d, sym(scenarios[i]))}</td>`;
  }).join('');

  const ml = metricLabel();
  const emptyTd = `<td style="border:1px solid var(--border);background:var(--input-bg);"></td>`;

  return `<table class="dt">
    <thead>
      <tr>
        <th class="label-td">Parameter</th>
        ${thScens}
        <th style="white-space:nowrap;vertical-align:middle;">
          <button class="btn-add" id="addScenBtn">+ Scenario</button>
        </th>
      </tr>
    </thead>
    <tbody>
      ${paramRows}
      <tr class="sep-tr"><td colspan="${n+2}"></td></tr>
      <tr class="out-own">
        <td class="label-td">🏠 Own — ${ml}</td>
        ${ownTds}${emptyTd}
      </tr>
      <tr class="out-rent">
        <td class="label-td">💰 Rent — ${ml}</td>
        ${rentTds}${emptyTd}
      </tr>
      <tr class="out-delta">
        <td class="label-td">Δ Own − Rent</td>
        ${deltaTds}${emptyTd}
      </tr>
    </tbody>
  </table>`;
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── RERENDER OUTPUT ONLY (skip model recompute) ── */
function rerenderOutputOnly(){
  const wrap = document.getElementById('tableWrap');
  if(!wrap) return;

  const ml = metricLabel();
  const sym = s => (s && s.currencySymbol) || '$';

  // Update own row label
  const ownLabelTd = wrap.querySelector('tr.out-own .label-td');
  if(ownLabelTd) ownLabelTd.textContent = '🏠 Own — '+ml;

  const rentLabelTd = wrap.querySelector('tr.out-rent .label-td');
  if(rentLabelTd) rentLabelTd.textContent = '💰 Rent — '+ml;

  // Update own value cells
  const ownTds = wrap.querySelectorAll('tr.out-own td:not(.label-td)');
  const rentTds = wrap.querySelectorAll('tr.out-rent td:not(.label-td)');
  const deltaTds = wrap.querySelectorAll('tr.out-delta td:not(.label-td)');

  scenarios.forEach((sc, i)=>{
    const v = getMetricValues(i);
    const s = sym(sc);
    if(ownTds[i]){
      ownTds[i].textContent = v.own!==null ? fmtCurrency(v.own, s) : '—';
    }
    if(rentTds[i]){
      rentTds[i].textContent = v.rent!==null ? fmtCurrency(v.rent, s) : '—';
    }
    if(deltaTds[i]){
      if(v.own===null){ deltaTds[i].textContent='—'; deltaTds[i].className='scen-td num-td'; return; }
      const d = v.own - v.rent;
      const cls = deltaColor(d);
      deltaTds[i].textContent = (d>=0?'+':'')+fmtCurrency(d, s);
      deltaTds[i].className = 'scen-td num-td '+cls;
    }
  });
}

/* ── RERENDER ── */
function rerender(){
  // Recompute all scenarios
  scenarioResults = scenarios.map(sc=>{
    try { return computeModel(buildStateObj(sc)); }
    catch(e){ console.error(e); return null; }
  });

  const wrap = document.getElementById('tableWrap');
  if(!wrap) return;
  wrap.innerHTML = buildTableHTML();
  wireEvents();
}

/* ── WIRE EVENTS ── */
function wireEvents(){
  // Scenario name inputs
  document.querySelectorAll('.scen-name-input').forEach(el=>{
    el.addEventListener('input', e=>{
      scenarios[+e.target.dataset.si].name = e.target.value;
    });
  });

  // Param inputs
  document.querySelectorAll('.param-input').forEach(el=>{
    el.addEventListener('change', e=>{
      const si = +e.target.dataset.si;
      const key = e.target.dataset.key;
      const p = PARAMS.find(x=>x.key===key);
      if(!p) return;
      let val;
      if(p.type==='integer') val = parseIntSafe(e.target.value, scenarios[si][key]);
      else if(p.type==='currency'||p.type==='percent') val = parseFloatSafe(e.target.value, scenarios[si][key]);
      else val = e.target.value;
      if(typeof p.min==='number') val = Math.max(p.min, val);
      if(typeof p.max==='number') val = Math.min(p.max, val);
      scenarios[si][key] = val;
      // Update viewYear max if horizon changed
      if(key==='horizon'){
        const maxH = Math.max(...scenarios.map(s=>s.horizon||1));
        document.getElementById('yearInput').max = maxH;
      }
      rerender();
    });
  });

  // Add scenario
  const addBtn = document.getElementById('addScenBtn');
  if(addBtn) addBtn.addEventListener('click', addScenario);

  // Remove scenario
  document.querySelectorAll('.rmv-scen').forEach(btn=>{
    btn.addEventListener('click', ()=> removeScenario(+btn.dataset.si));
  });

  // Duplicate scenario
  document.querySelectorAll('.btn-dupe').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const si = +btn.dataset.si;
      const clone = Object.assign({}, scenarios[si]);
      clone.name = scenarios[si].name + ' (copy)';
      scenarios.splice(si+1, 0, clone);
      rerender();
    });
  });
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', ()=>{
  rerender();

  // Theme toggle — start dark
  const themeBtn = document.getElementById('themeToggle');
  themeBtn.addEventListener('click', ()=>{
    document.body.classList.toggle('light');
    themeBtn.textContent = document.body.classList.contains('light') ? '🌙 Dark' : '☀️ Light';
  });

  // Metric selector
  document.getElementById('metricGroup').addEventListener('click', e=>{
    const btn = e.target.closest('.seg-btn');
    if(!btn || !btn.dataset.metric) return;
    metric = btn.dataset.metric;
    document.querySelectorAll('#metricGroup .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
    rerenderOutputOnly();
  });

  // Year input — full rerender so column header "capped at yr N" updates too
  document.getElementById('yearInput').addEventListener('input', e=>{
    viewYear = Math.max(1, parseIntSafe(e.target.value, 30));
    // Skip model recompute: just rebuild table HTML with cached results
    const wrap = document.getElementById('tableWrap');
    if(wrap){ wrap.innerHTML = buildTableHTML(); wireEvents(); }
  });
});

})();
</script>
</body>
</html>
