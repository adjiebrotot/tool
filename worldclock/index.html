      "@type": "Question",
      "name": "What time is it in Melbourne when it is 3pm in Perth?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on the date. Western Australia has no daylight saving, so 3pm in Perth is 5pm in Melbourne from early April to early October, and 6pm in Melbourne from early October to early April while Victoria is on daylight saving. Open the World Clock at https://tool.adjiebrotots.com/worldclock/ and use Time Travel to check any date."
      }
    },
    {
      "@type": "Question",
      "name": "Does the World Clock handle daylight saving time?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Every clock on the map is worked out by your browser from the IANA time zone database, the same rules your phone and computer use, so daylight saving is applied for today and for any date you Time Travel to. Hover over a place to see when its clocks next change."
      }
    }

<body class="light">
<main class="wc-app" id="app">

  <canvas id="baseCanvas" class="wc-canvas" aria-hidden="true"></canvas>
  <canvas id="nightCanvas" class="wc-canvas" aria-hidden="true"></canvas>
  <canvas id="labelCanvas" class="wc-canvas" role="img" aria-label="World map showing the local time in every time zone. Drag to move, scroll or pinch to zoom, hover or tap a place for details."></canvas>

  <div class="wc-loading" id="loading">Loading the map…</div>

  <!-- ── TOP: your time + navigation ─────────────────────────── -->
  <div class="wc-top">
    <section class="wc-now card" aria-label="Your date and time">
      <h1 class="wc-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1.15em" height="1.15em" aria-hidden="true" focusable="false" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle stroke="var(--accent)" cx="12" cy="12" r="9"/> <path stroke="var(--accent)" d="M3.8 8.5h16.4M3.8 15.5h16.4" opacity=".5"/> <path stroke="var(--accent2)" d="M12 6.8V12l3.4 2.3"/> </svg>World Clock</h1>
      <div class="wc-now-text" id="nowText" data-no-abbr>&nbsp;</div>
      <div class="wc-travelling" id="travelling" hidden>
        <span class="wc-travelling-tag">🚀 Time travelling</span>
        <button class="wc-link-btn" id="backNowChip">Back to now</button>
      </div>
    </section>
    <nav class="wc-nav">
      <a href="https://tool.adjiebrotots.com/" class="btn-theme btn-back" title="Other tools"><span aria-hidden="true">←</span><span class="wc-nav-label">&nbsp;Other Tools</span></a>
      <button class="btn-theme" id="themeToggle">🌙 Dark</button>
    </nav>
  </div>

  <!-- ── ZOOM ────────────────────────────────────────────────── -->
  <div class="wc-zoom" role="group" aria-label="Map zoom">
    <button class="wc-zbtn" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
    <button class="wc-zbtn" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
    <button class="wc-zbtn" id="zoomHome" title="Back to my region" aria-label="Back to my region"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
  </div>

  <!-- ── HOVER CARD ──────────────────────────────────────────── -->
  <div class="wc-card" id="placeCard" hidden data-no-abbr role="status" aria-live="polite"></div>

  <!-- ── TIME TRAVEL PANEL ───────────────────────────────────── -->
  <section class="wc-travel card" id="travelPanel" hidden data-no-persist aria-label="Time Travel">
    <div class="wc-travel-head">
      <div class="wc-travel-title">🚀 Time Travel</div>
      <button class="wc-x" id="travelClose" aria-label="Close Time Travel">✕</button>
    </div>
    <p class="wc-travel-sub">Pick a date and time. Every clock jumps to it.</p>
    <div class="wc-travel-grid">
      <label class="wc-field">
        <span class="field-label">Date</span>
        <input type="date" id="travelDate" class="txt-input" min="1971-01-01" max="2099-12-31">
      </label>
      <label class="wc-field">
        <span class="field-label">Time</span>
        <input type="time" id="travelTime" class="txt-input">
      </label>
    </div>
    <div class="wc-field">
      <label class="field-label" for="placeSearch">In</label>
      <div class="city-picker" id="placePicker">
        <input class="city-search" id="placeSearch" type="text" placeholder="Search a city or country…" autocomplete="off" spellcheck="false">
        <button class="city-clear" id="placeClear" aria-label="Clear place" type="button">✕</button>
        <div class="city-dropdown" id="placeList" role="listbox"></div>
      </div>
      <div class="field-sub">Or tap a place on the map.</div>
    </div>
    <div class="wc-travel-foot">
      <button class="btn-secondary" id="backNow">↩ Back to now</button>
    </div>
  </section>

  <!-- ── BOTTOM: controls + footer ──────────────────────────── -->
  <div class="wc-bottom">
    <div class="wc-controls card">
      <button class="wc-travel-btn" id="travelBtn" aria-expanded="false" aria-controls="travelPanel">🚀 Time Travel</button>
      <label class="wc-check"><input type="checkbox" id="showSeconds"> Show seconds</label>
      <div class="wc-view">
        <div class="seg-group" id="viewGroup" role="group" aria-label="Map view">
          <button class="seg-btn active" data-val="jur">Jurisdictions</button>
          <button class="seg-btn" data-val="tz">Time zones</button>
        </div>
        <span class="tip-wrap"><span class="tip-icon" id="viewTip" data-tip="">i</span></span>
      </div>
    </div>
